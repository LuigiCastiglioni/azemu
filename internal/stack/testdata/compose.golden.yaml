services:
    azemu-proxy:
        image: azemu-proxy:dev
        command:
            - proxy
            - --config
            - /azemu/proxy.json
        environment:
            AZEMU_CONFIG_HASH: 05d5e93fcd59a869
        volumes:
            - <ROOT>/.azemu/proxy.json:/azemu/proxy.json:ro
            - /home/u/.azemu/ca:/azemu/ca
            - azemu-certs:/azemu/certs
        ports:
            - 127.0.0.1:7001:7001
            - 127.0.0.1:7002:7002
        networks:
            default:
                aliases:
                    - eund-func-a.azurewebsites.net
                    - sta.blob.core.windows.net
        healthcheck:
            test:
                - CMD
                - wget
                - -qO-
                - http://localhost:8081/healthz
            interval: 2s
            timeout: 3s
            retries: 30
    azurite:
        image: mcr.microsoft.com/azure-storage/azurite
        command:
            - azurite
            - --blobHost
            - 0.0.0.0
            - --queueHost
            - 0.0.0.0
            - --tableHost
            - 0.0.0.0
            - --oauth
            - basic
            - --cert
            - /azemu/certs/azurite.pem
            - --key
            - /azemu/certs/azurite-key.pem
            - --skipApiVersionCheck
            - --loose
            - --location
            - /data
        environment:
            AZURITE_ACCOUNTS: sta:Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;stb:Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;stc:Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==
        volumes:
            - azemu-certs:/azemu/certs:ro
            - azurite-data:/data
        ports:
            - 127.0.0.1:10000:10000
            - 127.0.0.1:10001:10001
            - 127.0.0.1:10002:10002
        depends_on:
            azemu-proxy:
                condition: service_healthy
        healthcheck:
            test:
                - CMD
                - node
                - -e
                - require('net').connect(10000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))
            interval: 2s
            timeout: 3s
            retries: 30
    func-a:
        image: azemu/demo-app-func-a:dev
        build:
            context: <BUILD_TESTDATA>/py-uv
            dockerfile: <ROOT>/.azemu/build/func-a/Dockerfile
        platform: linux/amd64
        env_file:
            - path: <ROOT>/.azemu/env/func-a.env
              format: raw
        volumes:
            - azemu-certs:/azemu/certs:ro
        depends_on:
            azemu-proxy:
                condition: service_healthy
            azurite:
                condition: service_healthy
        restart: "no"
    web:
        image: azemu/demo-app-web:dev
        build:
            context: <ROOT>/apps/web
            dockerfile: <ROOT>/apps/web/Dockerfile
        platform: linux/arm64
        env_file:
            - path: <ROOT>/.azemu/env/web.env
              format: raw
        volumes:
            - azemu-certs:/azemu/certs:ro
        depends_on:
            azemu-proxy:
                condition: service_healthy
            azurite:
                condition: service_healthy
        restart: "no"
volumes:
    azemu-certs: {}
    azurite-data: {}
