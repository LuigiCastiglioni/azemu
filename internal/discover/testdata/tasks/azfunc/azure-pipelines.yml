parameters:
  - name: stage
    default: dev
variables:
  - name: fnName
    value: fa-${{ parameters.stage }}
  - group: some-secret-group
steps:
  - task: ArchiveFiles@2
    inputs:
      rootFolderOrFile: $(Build.SourcesDirectory)/apps/fa
      includeRootFolder: false
      archiveFile: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
  - task: AzureFunctionApp@2
    inputs:
      azureSubscription: sc-example
      appType: functionAppLinux
      appName: $(fnName)
      package: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
  - task: AzureFunctionApp@1
    inputs:
      appName: $(fromGroup)
      package: $(System.DefaultWorkingDirectory)/apps/other
